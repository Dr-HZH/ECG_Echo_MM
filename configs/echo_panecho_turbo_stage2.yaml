experiment:
  name: echo_panecho_turbo_stage2
  seed: 42
  output_dir: outputs/echo_phase3_1_turbo/stage2_partial

data:
  csv_path: manifests/echo_hfref_final_h5_manifest.csv
  path_col: h5_path
  h5_key_col: h5_key
  h5_root: .
  data_root: .
  patient_id_col: subject_id
  id_col: sample_id
  label_col: final_ischemia_label
  input_format: hdf5
  num_frames: 16
  image_size: 224
  target_channels: 3
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

augment:
  crop_scale_range: [0.9, 1.0]
  brightness_jitter: 0.05
  contrast_jitter: 0.05
  translate_fraction: 0.02

cross_validation:
  split_file: splits/echo_hfref_final_nested_5fold.csv

model:
  name: panecho
  classifier: panecho_industrial
  pretrained: true
  pretrained_source: local
  checkpoint_path: checkpoints/pretrained/panecho.pt
  freeze_mode: partial
  dropout: 0.25
  last_frame_weight: 0.25
  unfreeze_patterns:
    - "^transformer\\.layers\\.2\\."
    - "^transformer\\.layers\\.3\\."
  panecho:
    repo_path: third_party/PanEcho
    clip_len: 16

training:
  epochs: 18
  batch_size: 2
  gradient_accumulation_steps: 8
  num_workers: 4
  pin_memory: true
  optimizer: adamw
  lr_backbone: 8.0e-6
  lr_head: 1.5e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.1
  loss: focal
  focal_alpha: 0.45
  focal_gamma: 1.5
  use_pos_weight: true
  pos_weight_min: 0.5
  pos_weight_max: 2.0
  amp: true
  init_checkpoint: ""

evaluation:
  use_tta: true
  tta_shifts: [0, 4, 8]

checkpoint:
  patience: 5
